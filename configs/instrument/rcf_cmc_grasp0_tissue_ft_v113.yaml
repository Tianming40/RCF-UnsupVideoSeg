# rcf_cmc_grasp0_tissue_ft_v113.yaml
#
# v113 = v102 + quadratic per-channel affine motion model
#
# Changes vs v102:
#   decode_head.affine_order: 1 → 2
#
# Background: the current per-channel motion model (get_demean_affine_flow,
# used whenever free_residual_with_affine=True, which v83/v102 both have)
# fits a LINEAR affine map (2x2 matrix, 4 params) per channel via a
# closed-form weighted-least-squares solve. This is a pure-rotation+shear+
# scale rigid/affine model — it cannot represent genuinely non-rigid motion
# such as an instrument's jaw articulating relative to its shaft within a
# single channel.
#
# affine_order=2 (NEW mechanism this session, models/flow_aggregation_head_
# with_residual_v2.py) extends the per-channel coordinate feature basis from
# [dx, dy] (2-dim, linear) to [dx, dy, dx^2, dy^2, dx*dy] (5-dim, quadratic),
# fit via a generic torch.linalg.solve instead of the closed-form 2x2
# inverse the linear path uses (that closed-form exists only to dodge a
# documented CUDA MAGMA batched-LU misalignment bug specific to 2x2
# matrices — verified on GPU that 5x5 solves do not hit the same bug, so no
# workaround is needed there).
#
# Prior art for the underlying idea: V1 (flow_aggregation_head_with_
# residual.py) already had a `free_residual_with_affine_quadratic` flag and
# built the matching 5-dim coord_map, but V2 (the class every recent config
# actually uses) overrides get_demean_affine_flow/_demean_affine_flow_per_
# channel with the 2x2-specific closed form and never wired the quadratic
# option through — so despite existing in the code, this was NEVER actually
# usable via V2, and grep confirms zero configs or README entries ever used
# it. This version is the first time a working quadratic path exists for V2
# and the first time it's actually tested.
#
# Caution flagged in discussion before building this: an earlier session
# experiment (bridge-flow endpoint extrapolation, unrelated mechanism —
# quadratic/constant-acceleration MODEL for temporal extrapolation across
# g10/g5/g0, not a per-frame-pair spatial affine fit) found a 3-point
# quadratic fit performed slightly WORSE than a simpler 2-point linear fit,
# because the extra point was temporally distant and its curvature estimate
# picked up unrelated non-local dynamics (the grasp event) rather than
# local structure. That is a different mechanism (temporal vs spatial,
# extrapolation vs interpolation) so the failure mode doesn't obviously
# transfer, but it's a reason for caution rather than confidence — hence
# testing in isolation on the champion base rather than assuming it works.
#
# Isolated single-variable test: v102's recipe unchanged in every other way.

batch_size: 8
val_batch_size: 1
epochs: 80
learning_rate: 1.e-4
optimizer: Adam
weight_decay: 1.e-4

workers: 8

checkpoints_dir: saved/grasp0_tissue_ft_v113
pretrained_model: data/pretrained/densecl_r50_imagenet_200ep.pth
model_cls: RCFSoftTissueModel

eval_pos_th: 0.35
eval_save: false
use_sliding_window: true
sliding_window_size: 384
sliding_window_stride: 192
eval_export: false
export_all_seg: false

disable_wandb: true
allow_overwriting_checkpoints_dir: false

train_transform_kwargs:
  strong_aug: true
  resolution_crop_configs:
    - max_short_side: 576
      resize_short: 400
      crop_size: [384, 384]
    - max_short_side: 99999
      resize_short: 576
      crop_size: [384, 384]

test_transform_kwargs:
  strong_aug: false

loss_log_interval: 10
log_interval: 100

object_channel: null
set_object_channel_after_epoch: 0
oracle_exclude_channels: []
data_path: /media/mitiadmin/Micron_7450_1/tianming/dataset/CMC_grasp0_5_10_merged
test_data_path: /media/mitiadmin/Micron_7450_1/tianming/dataset/CMC_grasp0_deinterlaced/eval_tissue
dataset_kwargs: {}

train_dataset_kwargs:
  frame_num: 2
  load_flow: true
  flow_suffix:  "_NewCT"
  flow_suffix2: "_NewCT"
  flow_suffix3: "_NewCT"
  split: ImageSets/train_g0379_g5601_g10601_clean.txt
  zero_ann: false

test_dataset_kwargs:
  frame_num: 1
  load_flow: false
  split: ImageSets/val.txt
  zero_ann: false

val_dataset_list:
  - data_path: /media/mitiadmin/Micron_7450_1/tianming/dataset/CMC_grasp0_deinterlaced/eval_instrument
    split: ImageSets/val.txt
    name: instrument
  - data_path: /media/mitiadmin/Micron_7450_1/tianming/dataset/CMC_grasp0_deinterlaced/eval_tissue
    split: ImageSets/val.txt
    name: tissue

lr_scheduler_kwargs:
  power: 0.9
  min_lr: 1.e-5

saved_eval_dir_name: saved_eval

trainer_kwargs:
  check_val_every_n_epoch: 1
  amp_backend: "native"
  precision: 32
  benchmark: true

model_kwargs:
  w_seg: 1.0
  w_sharpen: 0
  w_entropy: 0.0
  separate_residual: true
  mask_layer: 5
  align_corners: false
  mask_size: [96, 96]       # ← matches MultiScaleSegHead output resolution, no interpolation needed
  allow_mask_resize: true
  gt_flow_downsample_mode: area
  log_interval: 100

  freeze_backbone: false
  freeze_backbone_stages: 0
  freeze_flow_head: false

  w_dino: 0.1
  dino_channels: null
  dino_checkpoint: /home/tianming/.cache/torch/hub/checkpoints/dino_deitsmall8_300ep_pretrain.pth
  dino_arch: vit_small
  dino_patch_size: 8
  dino_input_size: 128

  instrument_channels: []
  instrument_channel: 1
  tissue_channel: 2
  grasping_channel: 1
  bg_channels: [0, 3, 4]
  distill_channel: 1

  w_rigid:      0.0
  w_grasp_conv: 0.0
  w_deform:     0.0
  w_align:      0.0
  w_motion:     0.0
  motion_margin: 1.0
  deform_margin: 0.5
  min_grasp_frac: 0.005

  w_grasp_flow: 0.0
  w_dissect:    0.0
  grasp_flow_min_mag: 0.5
  dissect_sigma: 0.12

  w_contact: 0.0
  contact_dilation_r: 10
  w_div_tissue: 0.0

  w_rigid_tissue: 0.0

  w_flow_cosine: 0.0
  flow_cosine_temperature: 0.5
  flow_cosine_diversity: 0.5

  w_flow_tv: 0.0
  flow_tv_K: 5
  flow_tv_n_iter: 10
  flow_tv_start_epoch: 5
  flow_tv_push_margin: 0.3

  w_flow_cluster_ce: 0.0
  flow_cluster_ce_temperature: 0.3
  flow_cluster_ce_diversity: 0.5
  flow_cluster_ce_start_epoch: 0
  flow_cluster_ce_max_iter: 300
  flow_cluster_ce_color_weight: 0.0

  w_flow_angle_ce: 0.0
  flow_angle_ce_diversity: 0.0
  w_flow_angle_outside: 0.0

  w_flow_boundary_tv: 0.0
  flow_boundary_tv_var_window: 13
  flow_boundary_tv_alpha: 1.0

  w_flow_bilateral_ce: 0.0
  flow_bilateral_window: 15
  flow_bilateral_sigma: 0.3

  reset_non_instrument_heads: false
  reset_full_decode_head: false

  w_distill:    0.0
  distill_mode: symmetric
  teacher_ckpt: null

  backbone2:
    dilations: [1, 1, 2, 4]
    strides: [1, 2, 1, 1]
    type: ResNet
    depth: 50
    num_stages: 4
    out_indices: [0, 1, 2, 3]
    norm_cfg: &id001
      type: BN
      requires_grad: true
    norm_eval: false
    style: pytorch
    contract_dilation: true

  decode_head:
    ssim_sz: 1
    create_flownet: true
    mask_layer: 5
    type: FlowAggregationHeadWithResidualV2
    topk: 4
    boundary_threshold: 0.1745
    boundary_dilation: 15
    boundary_floor: 0.1
    flow_feat_before_agg_kernel_size: 3
    num_flow_feat_channels: 64
    mask_size: [96, 96]     # ← aligned with mask_size
    norm_flow: false
    clamp_flow_t: 10.
    affine_order: 2
    free_residual: false
    free_residual_with_affine: true
    free_scale: false
    outlier_robust_loss: false
    eps: 0.01
    q: 0.4
    allow_residual_resize: true
    residual_adjustment_scale: 10.
    pred_div_coeff: 10.

    use_bg_affine_removal: true

  # ── New segmentation head ──────────────────────────────────────────────────────────────
  decode_head2:
    type: MultiScaleSegHead
    num_classes: 5
    mid_channels: 256
    feat_channels: [256, 512, 1024, 2048]   # feat0, feat1, feat2, feat3
    fuse_dilation: 6        # ignored when use_aspp=true
    use_aspp: true
    aspp_rates: [6, 12, 18]
    dropout_ratio: 0.1
    align_corners: false

  decode_head3:
    concat_input: false
    dilation: 6
    channels: 256
    type: FCNHead
    in_channels: 4096
    in_index: -1
    num_convs: 2
    dropout_ratio: 0.1
    num_classes: 20
    norm_cfg: *id001
    align_corners: false
    loss_decode:
      type: CrossEntropyLoss
      use_sigmoid: false
      loss_weight: 1.0
