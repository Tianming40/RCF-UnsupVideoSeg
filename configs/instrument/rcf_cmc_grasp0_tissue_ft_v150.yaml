# rcf_cmc_grasp0_tissue_ft_v150.yaml
#
# v150 = v102 (this project's all-time champion, 139.77/140.12 sum) +
# MultiScaleSegHeadHiRes (models/multi_scale_seg_head_hires.py, new file),
# discussed 260731. This is a genuinely bigger change than v144-v149 --
# it changes decode_head2's OUTPUT RESOLUTION itself, from H/4 (96x96 for a
# 384 crop) to H/2 (192x192), not just an additive signal fused on top of
# the existing 96x96 pipeline.
#
# Motivation (260731 review of the eval sliding-window discussion, and
# separately of feat0 vs feat1/2/3's roles): v102's decode_head2 has NEVER
# output more than H/4 resolution -- feat0 itself (backbone2's finest
# out_indices feature) is already at that resolution, and GT flow is
# downsampled 4x (384->96) before the warp loss ever sees it. This is a
# real, constant precision ceiling, independent of the separate sliding-
# window-overlap issue discussed the same day. backbone2's stem
# (conv1+norm1+relu, BEFORE maxpool) computes a stride-2 (192x192 here),
# 64-channel activation on every forward pass that is discarded today
# (out_indices only keeps the 4 res_layer outputs) -- using it costs ZERO
# extra backbone compute and doesn't touch backbone2's stride/dilation
# structure or its pretrained-weight alignment.
#
# Mechanism (see models/multi_scale_seg_head_hires.py's docstring for the
# full derivation): MultiScaleSegHeadHiRes subclasses MultiScaleSegHead,
# reusing Steps 1-7 (forward_features(), pulled out of the parent's forward()
# as a behaviour-preserving refactor, 260731) unchanged, then bilinearly
# upsamples that H/4 feature to H/2 (a FIXED, non-trainable op), concatenates
# a projection of the stem feature, refines with two conv layers (the LAST
# zero-initialized), and classifies with the SAME conv_seg inherited from
# the parent. Because conv_seg is a 1x1 conv (linear + per-channel constant
# bias), it PROVABLY commutes with bilinear interpolation -- so at
# initialization this head's H/2 output is mathematically IDENTICAL (not
# just empirically close) to bilinearly upsampling what v102's own H/4
# output would have been. v102's own trained optimum (from the
# densecl_r50_imagenet_200ep.pth-initialized backbone) is the literal,
# exact starting point.
#
# Stem-feature capture: a forward hook on backbone2.relu (registered in
# RCFModel.__init__, models/rcf_model.py, 260731) -- NOT detached, so
# gradient flows back into backbone2's earliest layers through this new
# path too. Harmless/no-op for every decode_head2 that doesn't declare
# use_stem_feat=True (i.e. every other existing config).
#
# Downstream consequences of the resolution change (verified before
# submitting -- see conversation): decode_head's weighted-least-squares
# motion fit builds its coord_map from mask_size at construction time (not
# hardcoded to 96), and decode_head3's residual output already auto-resizes
# to mask_size via bilinear if shapes mismatch -- so BOTH mask_size (model_
# kwargs, top level) and decode_head.mask_size below are changed to
# [192, 192], and everything downstream reconstructs correctly at the new
# resolution with no further code changes needed. GT flow is correspondingly
# downsampled 384->192 (2x, gentler than v102's 384->96 4x) before the warp
# loss -- more real supervision signal density is preserved, though this
# also means the loss operates at 4x more pixels (compute cost up, expected
# tractable since the fit's per-pixel ops are linear, not the cubic-cost
# eigh used elsewhere in the DINO-graph lines).
#
# This is NOT combinable-by-default with v146/v147/v148/v149's DINO-graph
# additions in this config (none of their toggles are set) -- kept as an
# isolated single-variable test of the resolution change alone.
# ────────────────────────────────────────────────────────────────────────
#
# v102 = v83 + GT flow downsample mode: bilinear → area
#
# Changes vs v83:
#   model_kwargs.gt_flow_downsample_mode: bilinear → area
#
# GT flow is downsampled from crop resolution (384x384) to mask_size
# (96x96, 4x reduction) before the warp loss. Bilinear interpolation blends
# instrument-boundary motion vectors with surrounding background motion
# AT THE DOWNSAMPLE STEP ITSELF, before boundary_dilation/floor even get a
# chance to weight anything — for a target that occupies ~1% of frame area,
# this dilutes exactly the pixels v83's supervision-density mechanism is
# built to preserve. 'area' (box/average pooling — the more standard choice
# for *downsampling* specifically; bilinear is more natural for upsampling)
# is tested here as the isolated single-variable alternative.
# New model-level `gt_flow_downsample_mode` param (models/rcf_model.py,
# default 'bilinear' so all other configs are unaffected); only the GT-flow
# resize call site in forward_train uses it — mask/pred-flow resizing
# elsewhere is untouched. No other v83 setting touched.

batch_size: 8
val_batch_size: 1
epochs: 80
learning_rate: 1.e-4
optimizer: Adam
weight_decay: 1.e-4

workers: 8

checkpoints_dir: saved/grasp0_tissue_ft_v150
pretrained_model: data/pretrained/densecl_r50_imagenet_200ep.pth
model_cls: RCFSoftTissueModel

eval_pos_th: 0.35
eval_save: false
use_sliding_window: true
sliding_window_size: 384
sliding_window_stride: 192
eval_export: false
export_all_seg: false

disable_wandb: true
allow_overwriting_checkpoints_dir: false

train_transform_kwargs:
  strong_aug: true
  resolution_crop_configs:
    - max_short_side: 576
      resize_short: 400
      crop_size: [384, 384]
    - max_short_side: 99999
      resize_short: 576
      crop_size: [384, 384]

test_transform_kwargs:
  strong_aug: false

loss_log_interval: 10
log_interval: 100

object_channel: null
set_object_channel_after_epoch: 0
oracle_exclude_channels: []
data_path: /media/mitiadmin/Micron_7450_1/tianming/dataset/CMC_grasp0_5_10_merged
test_data_path: /media/mitiadmin/Micron_7450_1/tianming/dataset/CMC_grasp0_deinterlaced/eval_tissue
dataset_kwargs: {}

train_dataset_kwargs:
  frame_num: 2
  load_flow: true
  flow_suffix:  "_NewCT"
  flow_suffix2: "_NewCT"
  flow_suffix3: "_NewCT"
  split: ImageSets/train_g0379_g5601_g10601_clean.txt
  zero_ann: false

test_dataset_kwargs:
  frame_num: 1
  load_flow: false
  split: ImageSets/val.txt
  zero_ann: false

val_dataset_list:
  - data_path: /media/mitiadmin/Micron_7450_1/tianming/dataset/CMC_grasp0_deinterlaced/eval_instrument
    split: ImageSets/val.txt
    name: instrument
  - data_path: /media/mitiadmin/Micron_7450_1/tianming/dataset/CMC_grasp0_deinterlaced/eval_tissue
    split: ImageSets/val.txt
    name: tissue

lr_scheduler_kwargs:
  power: 0.9
  min_lr: 1.e-5

saved_eval_dir_name: saved_eval

trainer_kwargs:
  check_val_every_n_epoch: 1
  amp_backend: "native"
  precision: 32
  benchmark: true

model_kwargs:
  w_seg: 1.0
  w_sharpen: 0
  w_entropy: 0.0
  separate_residual: true
  mask_layer: 5
  align_corners: false
  mask_size: [192, 192]     # ← CHANGED from v102's [96,96] -- H/2 instead of H/4
  allow_mask_resize: true
  gt_flow_downsample_mode: area
  log_interval: 100

  freeze_backbone: false
  freeze_backbone_stages: 0
  freeze_flow_head: false

  w_dino: 0.1
  dino_channels: null
  dino_checkpoint: /home/tianming/.cache/torch/hub/checkpoints/dino_deitsmall8_300ep_pretrain.pth
  dino_arch: vit_small
  dino_patch_size: 8
  dino_input_size: 128

  instrument_channels: []
  instrument_channel: 1
  tissue_channel: 2
  grasping_channel: 1
  bg_channels: [0, 3, 4]
  distill_channel: 1

  w_rigid:      0.0
  w_grasp_conv: 0.0
  w_deform:     0.0
  w_align:      0.0
  w_motion:     0.0
  motion_margin: 1.0
  deform_margin: 0.5
  min_grasp_frac: 0.005

  w_grasp_flow: 0.0
  w_dissect:    0.0
  grasp_flow_min_mag: 0.5
  dissect_sigma: 0.12

  w_contact: 0.0
  contact_dilation_r: 10
  w_div_tissue: 0.0

  w_rigid_tissue: 0.0

  w_flow_cosine: 0.0
  flow_cosine_temperature: 0.5
  flow_cosine_diversity: 0.5

  w_flow_tv: 0.0
  flow_tv_K: 5
  flow_tv_n_iter: 10
  flow_tv_start_epoch: 5
  flow_tv_push_margin: 0.3

  w_flow_cluster_ce: 0.0
  flow_cluster_ce_temperature: 0.3
  flow_cluster_ce_diversity: 0.5
  flow_cluster_ce_start_epoch: 0
  flow_cluster_ce_max_iter: 300
  flow_cluster_ce_color_weight: 0.0

  w_flow_angle_ce: 0.0
  flow_angle_ce_diversity: 0.0
  w_flow_angle_outside: 0.0

  w_flow_boundary_tv: 0.0
  flow_boundary_tv_var_window: 13
  flow_boundary_tv_alpha: 1.0

  w_flow_bilateral_ce: 0.0
  flow_bilateral_window: 15
  flow_bilateral_sigma: 0.3

  reset_non_instrument_heads: false
  reset_full_decode_head: false

  w_distill:    0.0
  distill_mode: symmetric
  teacher_ckpt: null

  backbone2:
    dilations: [1, 1, 2, 4]
    strides: [1, 2, 1, 1]
    type: ResNet
    depth: 50
    num_stages: 4
    out_indices: [0, 1, 2, 3]
    norm_cfg: &id001
      type: BN
      requires_grad: true
    norm_eval: false
    style: pytorch
    contract_dilation: true

  decode_head:
    ssim_sz: 1
    create_flownet: true
    mask_layer: 5
    type: FlowAggregationHeadWithResidualV2
    topk: 4
    boundary_threshold: 0.1745
    boundary_dilation: 15
    boundary_floor: 0.1
    flow_feat_before_agg_kernel_size: 3
    num_flow_feat_channels: 64
    mask_size: [192, 192]   # ← CHANGED from v102's [96,96], must match model_kwargs.mask_size above
    norm_flow: false
    clamp_flow_t: 10.
    free_residual: false
    free_residual_with_affine: true
    free_scale: false
    outlier_robust_loss: false
    eps: 0.01
    q: 0.4
    allow_residual_resize: true
    residual_adjustment_scale: 10.
    pred_div_coeff: 10.

    use_bg_affine_removal: true

  # ── New segmentation head ──────────────────────────────────────────────────────────────
  decode_head2:
    type: MultiScaleSegHeadHiRes
    num_classes: 5
    mid_channels: 256
    feat_channels: [256, 512, 1024, 2048]   # feat0, feat1, feat2, feat3
    fuse_dilation: 6        # ignored when use_aspp=true
    use_aspp: true
    aspp_rates: [6, 12, 18]
    dropout_ratio: 0.1
    align_corners: false
    stem_channels: 64       # matches ResNet50's default stem output channels
    hires_channels: 64      # internal width of the new upsample-refine stage

  decode_head3:
    concat_input: false
    dilation: 6
    channels: 256
    type: FCNHead
    in_channels: 4096
    in_index: -1
    num_convs: 2
    dropout_ratio: 0.1
    num_classes: 20
    norm_cfg: *id001
    align_corners: false
    loss_decode:
      type: CrossEntropyLoss
      use_sigmoid: false
      loss_weight: 1.0
