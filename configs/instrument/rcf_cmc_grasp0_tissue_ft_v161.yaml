# rcf_cmc_grasp0_tissue_ft_v161.yaml
#
# v161 = v102 + DINO graph BAYESIAN prior (replaces v149's concat-into-feat3
# fusion) + motion-likelihood auxiliary loss, discussed 260811 ("先验/后验"
# framing).
#
# Built on v102 directly (NOT v152) -- deliberate choice, discussed
# explicitly: v152 = v149 + bg_removal_affine, and bg_removal_affine was
# isolated this session as the cause of a real, systematic instrument-mIoU
# decay-over-training pattern (v151/v152's full 81-epoch curves both show
# "early peak ~63-68% then decline to a ~50-57% plateau", v102/v149 don't).
# Building this NEW mechanism on v152 would confound "does the Bayesian
# prior help" with "is bg_removal_affine's known problem still there" --
# building on v149's base (itself v102 + the OLD concat fusion, being
# replaced here) keeps this a clean, single-variable comparison against
# v149.
#
# ── What this replaces and why ──────────────────────────────────────────
# v149's DinoGraphFusionHead concatenates DINO eigenvectors into feat3 (a
# mid-network CNN feature), then several more conv/ASPP layers in
# decode_head2 reprocess them before any decision is made -- the
# eigenvector signal's actual influence on the final mask is whatever those
# later layers implicitly learned to do with it, entangled with everything
# else those layers do. Discussed 260811: this project's own architecture
# is already an EM-style motion-clustering model (mask = E-step soft
# responsibility, per-channel rigid-motion fit = M-step, warp_seg loss
# drives both) -- reframed that way, DINO's eigenvectors are a genuine,
# motion-INDEPENDENT prior P(channel | appearance), and the existing (but
# never enabled) _em_consistency_loss already computes a genuine motion
# LIKELIHOOD P(channel | flow) = softmax(-per_channel_rigid_motion_error/T).
# Bayes' rule combines these by ADDING their logs -- this config implements
# exactly that, instead of the opaque mid-network concat.
#
# Paper re-read in full for this (2408.14789v3, "Revisiting Surgical
# Instrument Segmentation Without Human Intervention: A Graph Partitioning
# View") -- important correction to this project's earlier informal
# description: individual eigenvectors are NOT per-pixel class
# probabilities, each is a single real-valued partition "mode" at a
# specific normalized-cut granularity (v1/v2 = coarsest/most salient split,
# higher-index eigenvectors = progressively finer detail, becoming
# noise-like past roughly g~10-15 for binary/part-level tasks -- the
# paper's own Table 6 ablation). The paper's own recipe for turning
# eigenvectors into an actual segmentation is to stack the first g into a
# g-dim per-pixel EMBEDDING and run K-MEANS on that embedding (Sec 3.5) --
# NOT to read off class membership from raw eigenvector values directly.
#
# New module models/dino_graph_bayesian_prior.py's DinoGraphBayesianPrior
# follows that recipe with learnable (gradient-trainable) centroids instead
# of an offline K-Means pass: soft squared-distance to C=mask_layer=5
# centroids in the 10-dim eigenvector-embedding space, temperature-scaled
# -- mathematically the SAME form as the motion side's softmax(-error/T)
# likelihood, so prior and likelihood are dimensionally/functionally
# symmetric before being summed. Output is scaled by a zero-init learnable
# scalar (out_scale), so this module's contribution to the mask logits is
# EXACTLY 0 at step 0 regardless of centroid/eigenvector values -- same
# "exact no-op at init" discipline as every other DINO-graph module added
# this project. Added DIRECTLY to decode_head2's raw mask logits, BEFORE
# the final softmax (both forward_train and forward_eval, hasattr/getattr-
# guarded, mirrors every other DINO-graph hook's pattern) -- a decision-
# layer fusion, not a feature-layer one.
#
# The "likelihood" half (motion side) is the project's EXISTING
# _em_consistency_loss (models/flow_aggregation_head_with_residual_v2.py,
# written earlier this session's predecessor sessions but never enabled in
# any shipped config until now) -- turned on here with a modest weight
# (em_consistency_weight: 0.1, matching w_dino's own scale) as a genuine
# motion-derived soft-label distillation loss on mask, rather than trying
# to fold the (circular -- needs a per-channel rigid-motion fit, which
# itself needs a mask) likelihood directly into this same forward pass's
# logits.
#
# Changes vs v149:
#   model_kwargs.use_dino_graph_fusion_deep: true -> false (REMOVED, this
#     is what's being replaced/compared against, not stacked with)
#   model_kwargs.use_dino_graph_bayesian_prior: true (new)
#   model_kwargs.dino_bayes_*: new params (input_size/grid_size match the
#     validated 384/32 configuration from spectral_test.jpg; num_eigvecs=10
#     matches this paper's own binary-segmentation-optimal g, Table 6)
#   decode_head.use_em_consistency_loss: true (new -- the "likelihood" half)
#   decode_head.em_consistency_weight: 0.1
#   decode_head.em_consistency_temperature: 1.0 (default, untuned -- first
#     pass)
# ────────────────────────────────────────────────────────────────────────
#
# v102 = v83 + GT flow downsample mode: bilinear → area
#
# Changes vs v83:
#   model_kwargs.gt_flow_downsample_mode: bilinear → area
#
# GT flow is downsampled from crop resolution (384x384) to mask_size
# (96x96, 4x reduction) before the warp loss. Bilinear interpolation blends
# instrument-boundary motion vectors with surrounding background motion
# AT THE DOWNSAMPLE STEP ITSELF, before boundary_dilation/floor even get a
# chance to weight anything — for a target that occupies ~1% of frame area,
# this dilutes exactly the pixels v83's supervision-density mechanism is
# built to preserve. 'area' (box/average pooling — the more standard choice
# for *downsampling* specifically; bilinear is more natural for upsampling)
# is tested here as the isolated single-variable alternative.
# New model-level `gt_flow_downsample_mode` param (models/rcf_model.py,
# default 'bilinear' so all other configs are unaffected); only the GT-flow
# resize call site in forward_train uses it — mask/pred-flow resizing
# elsewhere is untouched. No other v83 setting touched.

batch_size: 8
val_batch_size: 1
epochs: 80
learning_rate: 1.e-4
optimizer: Adam
weight_decay: 1.e-4

workers: 8

checkpoints_dir: saved/grasp0_tissue_ft_v161
pretrained_model: data/pretrained/densecl_r50_imagenet_200ep.pth
model_cls: RCFSoftTissueModel

eval_pos_th: 0.35
eval_save: false
use_sliding_window: true
sliding_window_size: 384
sliding_window_stride: 192
eval_export: false
export_all_seg: false

disable_wandb: true
allow_overwriting_checkpoints_dir: false

train_transform_kwargs:
  strong_aug: true
  resolution_crop_configs:
    - max_short_side: 576
      resize_short: 400
      crop_size: [384, 384]
    - max_short_side: 99999
      resize_short: 576
      crop_size: [384, 384]

test_transform_kwargs:
  strong_aug: false

loss_log_interval: 10
log_interval: 100

object_channel: null
set_object_channel_after_epoch: 0
oracle_exclude_channels: []
data_path: /media/mitiadmin/Micron_7450_1/tianming/dataset/CMC_grasp0_5_10_merged
test_data_path: /media/mitiadmin/Micron_7450_1/tianming/dataset/CMC_grasp0_deinterlaced/eval_tissue
dataset_kwargs: {}

train_dataset_kwargs:
  frame_num: 2
  load_flow: true
  flow_suffix:  "_NewCT"
  flow_suffix2: "_NewCT"
  flow_suffix3: "_NewCT"
  split: ImageSets/train_g0379_g5601_g10601_clean.txt
  zero_ann: false

test_dataset_kwargs:
  frame_num: 1
  load_flow: false
  split: ImageSets/val.txt
  zero_ann: false

val_dataset_list:
  - data_path: /media/mitiadmin/Micron_7450_1/tianming/dataset/CMC_grasp0_deinterlaced/eval_instrument
    split: ImageSets/val.txt
    name: instrument
  - data_path: /media/mitiadmin/Micron_7450_1/tianming/dataset/CMC_grasp0_deinterlaced/eval_tissue
    split: ImageSets/val.txt
    name: tissue

lr_scheduler_kwargs:
  power: 0.9
  min_lr: 1.e-5

saved_eval_dir_name: saved_eval

trainer_kwargs:
  check_val_every_n_epoch: 1
  amp_backend: "native"
  precision: 32
  benchmark: true

model_kwargs:
  w_seg: 1.0
  w_sharpen: 0
  w_entropy: 0.0
  separate_residual: true
  mask_layer: 5
  align_corners: false
  mask_size: [96, 96]       # ← matches MultiScaleSegHead output resolution, no interpolation needed
  allow_mask_resize: true
  gt_flow_downsample_mode: area
  log_interval: 100

  freeze_backbone: false
  freeze_backbone_stages: 0
  freeze_flow_head: false

  w_dino: 0.1
  dino_channels: null
  dino_checkpoint: /home/tianming/.cache/torch/hub/checkpoints/dino_deitsmall8_300ep_pretrain.pth
  dino_arch: vit_small
  dino_patch_size: 8
  dino_input_size: 128

  # ── DINO graph BAYESIAN prior (new, 260811) -- replaces v149's concat ──
  # fusion at feat3 with a decision-layer additive log-prior, see header
  use_dino_graph_bayesian_prior: true
  dino_bayes_input_size: 384     # same validated config as v146/v149
  dino_bayes_grid_size: 32       # (saved/edge_test_260729/spectral_test.jpg)
  dino_bayes_num_eigvecs: 10     # matches paper's own binary-seg-optimal g (Table 6)
  dino_bayes_temperature: 1.0    # untuned first pass
  dino_bayes_chunk_size: 8       # peak-memory control only

  instrument_channels: []
  instrument_channel: 1
  tissue_channel: 2
  grasping_channel: 1
  bg_channels: [0, 3, 4]
  distill_channel: 1

  w_rigid:      0.0
  w_grasp_conv: 0.0
  w_deform:     0.0
  w_align:      0.0
  w_motion:     0.0
  motion_margin: 1.0
  deform_margin: 0.5
  min_grasp_frac: 0.005

  w_grasp_flow: 0.0
  w_dissect:    0.0
  grasp_flow_min_mag: 0.5
  dissect_sigma: 0.12

  w_contact: 0.0
  contact_dilation_r: 10
  w_div_tissue: 0.0

  w_rigid_tissue: 0.0

  w_flow_cosine: 0.0
  flow_cosine_temperature: 0.5
  flow_cosine_diversity: 0.5

  w_flow_tv: 0.0
  flow_tv_K: 5
  flow_tv_n_iter: 10
  flow_tv_start_epoch: 5
  flow_tv_push_margin: 0.3

  w_flow_cluster_ce: 0.0
  flow_cluster_ce_temperature: 0.3
  flow_cluster_ce_diversity: 0.5
  flow_cluster_ce_start_epoch: 0
  flow_cluster_ce_max_iter: 300
  flow_cluster_ce_color_weight: 0.0

  w_flow_angle_ce: 0.0
  flow_angle_ce_diversity: 0.0
  w_flow_angle_outside: 0.0

  w_flow_boundary_tv: 0.0
  flow_boundary_tv_var_window: 13
  flow_boundary_tv_alpha: 1.0

  w_flow_bilateral_ce: 0.0
  flow_bilateral_window: 15
  flow_bilateral_sigma: 0.3

  reset_non_instrument_heads: false
  reset_full_decode_head: false

  w_distill:    0.0
  distill_mode: symmetric
  teacher_ckpt: null

  backbone2:
    dilations: [1, 1, 2, 4]
    strides: [1, 2, 1, 1]
    type: ResNet
    depth: 50
    num_stages: 4
    out_indices: [0, 1, 2, 3]
    norm_cfg: &id001
      type: BN
      requires_grad: true
    norm_eval: false
    style: pytorch
    contract_dilation: true

  decode_head:
    ssim_sz: 1
    create_flownet: true
    mask_layer: 5
    type: FlowAggregationHeadWithResidualV2
    topk: 4
    boundary_threshold: 0.1745
    boundary_dilation: 15
    boundary_floor: 0.1
    flow_feat_before_agg_kernel_size: 3
    num_flow_feat_channels: 64
    mask_size: [96, 96]     # ← aligned with mask_size
    norm_flow: false
    clamp_flow_t: 10.
    free_residual: false
    free_residual_with_affine: true
    free_scale: false
    outlier_robust_loss: false
    eps: 0.01
    q: 0.4
    allow_residual_resize: true
    residual_adjustment_scale: 10.
    pred_div_coeff: 10.

    use_bg_affine_removal: true

    # ── motion likelihood (the "posterior" half's other term), new 260811 ─
    use_em_consistency_loss: true
    em_consistency_weight: 0.1
    em_consistency_temperature: 1.0

  # ── New segmentation head ──────────────────────────────────────────────────────────────
  decode_head2:
    type: MultiScaleSegHead
    num_classes: 5
    mid_channels: 256
    feat_channels: [256, 512, 1024, 2048]   # feat0, feat1, feat2, feat3
    fuse_dilation: 6        # ignored when use_aspp=true
    use_aspp: true
    aspp_rates: [6, 12, 18]
    dropout_ratio: 0.1
    align_corners: false

  decode_head3:
    concat_input: false
    dilation: 6
    channels: 256
    type: FCNHead
    in_channels: 4096
    in_index: -1
    num_convs: 2
    dropout_ratio: 0.1
    num_classes: 20
    norm_cfg: *id001
    align_corners: false
    loss_decode:
      type: CrossEntropyLoss
      use_sigmoid: false
      loss_weight: 1.0
