# rcf_cmc_grasp10_finetune_dino.yaml
#
# Fine-tune DINO Phase 1 checkpoint on CMC_grasp10_deinterlaced.
#
# Strategy:
#   - Start from Phase 1 best checkpoint (epoch=7, val_miou=76.46%)
#   - Self-supervised fine-tuning on grasp10 4-fold train split (no flow annotations, flow self-supervised loss only)
#   - Validate on data_medical fold1_val.txt (uniform size, avoids grasp10 variable-resolution collate issue)
#   - Final evaluation with run_grasp10_eval.sh --split grasp10_foldN_val.txt per fold
#
# 4-fold split (601 sequences, sorted by seq_id):
#   Fold 1: train=450  val=151
#   Fold 2: train=451  val=150
#   Fold 3: train=451  val=150
#   Fold 4: train=451  val=150
#
# Usage (fold 1 example):
#   python main_dino.py configs/instrument/rcf_cmc_grasp10_finetune_dino.yaml \
#       --opts \
#           checkpoints_dir saved/grasp10_ft_fold1 \
#           allow_overwriting_checkpoints_dir True \
#           "train_dataset_kwargs.split" ImageSets/grasp10_fold1_train.txt \
#           "test_dataset_kwargs.split" grasp10_fold1_val.txt
#
# Or use script/run_grasp10_finetune.sh [fold] [gpu]

batch_size: 8
epochs: 20
learning_rate: 5.e-5
optimizer: Adam
weight_decay: 1.e-4

workers: 8

checkpoints_dir: saved/grasp10_ft_fold1      # overridden via --opts
pretrained_model: saved/cmc_dino_phase1_260605_143205/epoch=7-step=1800.ckpt
model_cls: RCFDinoModel

eval_pos_th: 0.35
eval_save: true
eval_export: false
export_all_seg: false

disable_wandb: true
allow_overwriting_checkpoints_dir: false

train_transform_kwargs:
  strong_aug: true

test_transform_kwargs:
  strong_aug: false
  test_crop_size: [384, 384]   # resize val images to uniform size, enables batch_size=8

loss_log_interval: 10
log_interval: 100    # reduce training visualisation save frequency

object_channel: 1   # ch1=instrument confirmed in Phase 1, locked directly, no auto channel selection needed

# ── Training: grasp10 (default fold 1, override via --opts) ──────────────
data_path: /media/mitiadmin/Micron_7450_1/tianming/dataset/CMC_grasp10_deinterlaced
dataset_kwargs: {}

train_dataset_kwargs:
  frame_num: 2
  load_flow: true
  flow_suffix: "_NewCT"      # grasp10 has only one flow type
  flow_suffix2: "_NewCT"     # no gap=2 flow, fall back to same directory
  flow_suffix3: "_NewCT"     # same as above
  split: ImageSets/grasp10_fold1_train.txt
  zero_ann: false

# ── Validation: grasp10 fold-val (resized to 384×384 for uniform size, supports batch_size=8) ─
# Default fold1_val, override via --opts "test_dataset_kwargs.split"
test_dataset_kwargs:
  frame_num: 1
  load_flow: false
  split: ImageSets/grasp10_fold1_val.txt
  zero_ann: false

lr_scheduler_kwargs:
  power: 0.9
  min_lr: 1.e-6

set_object_channel_after_epoch: 0   # object_channel is fixed, this value has no effect

saved_eval_dir_name: saved_eval

trainer_kwargs:
  check_val_every_n_epoch: 1
  amp_backend: "native"
  precision: 32
  benchmark: true

model_kwargs:
  # ── Identical model architecture to Phase 1 ──────────────────────────────
  w_seg: 1.0
  w_sharpen: 0
  w_entropy: 0.05
  separate_residual: true
  mask_layer: 5
  align_corners: false
  mask_size: [128, 128]
  allow_mask_resize: true
  log_interval: 100

  w_dino: 0.05     # slightly reduced DINO weight for fine-tuning (0.08→0.05) to let warp loss dominate
  dino_checkpoint: /home/tianming/.cache/torch/hub/checkpoints/dino_deitsmall8_300ep_pretrain.pth
  dino_arch: vit_small
  dino_patch_size: 8
  dino_input_size: 128

  backbone2:
    dilations: [1, 1, 2, 4]
    strides: [1, 2, 1, 1]
    type: ResNet
    depth: 50
    num_stages: 4
    out_indices: [0, 1, 2, 3]
    norm_cfg: &id001
      type: BN
      requires_grad: true
    norm_eval: false
    style: pytorch
    contract_dilation: true

  decode_head:
    ssim_sz: 1
    create_flownet: true
    mask_layer: 5
    type: FlowAggregationHeadWithResidualV2
    topk: 4
    boundary_threshold: 0.1745
    flow_feat_before_agg_kernel_size: 3
    num_flow_feat_channels: 64
    mask_size: [128, 128]
    norm_flow: false
    clamp_flow_t: 10.
    free_residual: false
    free_residual_with_affine: true
    free_scale: false
    outlier_robust_loss: false
    eps: 0.01
    q: 0.4
    allow_residual_resize: true
    residual_adjustment_scale: 10.
    pred_div_coeff: 10.

  decode_head2:
    input_transform: resize_concat
    concat_input: false
    dilation: 6
    channels: 256
    type: FCNHead
    in_channels: [256, 2048]
    in_index: [0, 3]
    num_convs: 2
    dropout_ratio: 0.1
    num_classes: 5
    norm_cfg: *id001
    align_corners: false
    loss_decode:
      type: CrossEntropyLoss
      use_sigmoid: false
      loss_weight: 1.0

  decode_head3:
    concat_input: false
    dilation: 6
    channels: 256
    type: FCNHead
    in_channels: 4096
    in_index: -1
    num_convs: 2
    dropout_ratio: 0.1
    num_classes: 20
    norm_cfg: *id001
    align_corners: false
    loss_decode:
      type: CrossEntropyLoss
      use_sigmoid: false
      loss_weight: 1.0
