# rcf_cmc_grasp10_ft_v4_eval_all.yaml
#
# Run inference on all 601 sequences and export masks for all 5 channels (soft probability, 0-1).
# Uses sliding window (384x384, stride=192) to keep BN statistics consistent with training.
#
# Usage:
#   python main_dino.py configs/instrument/rcf_cmc_grasp10_ft_v4_eval_all.yaml \
#       --test \
#       --test-override-object-channel 1 \
#       --opts \
#           checkpoints_dir            saved/grasp10_ft_v4_eval_all \
#           allow_overwriting_checkpoints_dir True \
#           pretrained_model           saved/grasp10_ft_v4_fold1_260609_104944/epoch=10-step=1232.ckpt
#
# Output: saved/grasp10_ft_v4_eval_all/saved_eval_export/{0,1,2,3,4}/pred_seg_*.png
#   channel 0: background
#   channel 1: instrument
#   channel 2-4: other semantic regions

batch_size: 1
epochs: 0
learning_rate: 1.e-4
optimizer: Adam
weight_decay: 1.e-4

workers: 8

checkpoints_dir: saved/grasp10_ft_v4_eval_all
pretrained_model: saved/grasp10_ft_v4_fold1_260609_104944/epoch=14-step=1680.ckpt
model_cls: RCFDinoModel

eval_pos_th: 0.35
eval_save: false
eval_export: true
export_all_seg: true

use_sliding_window: true
sliding_window_size: 384
sliding_window_stride: 192

disable_wandb: true
allow_overwriting_checkpoints_dir: true

test_transform_kwargs:
  strong_aug: false

object_channel: 1
set_object_channel_after_epoch: 0

# Train set (placeholder, not used in --test mode)
data_path: /media/mitiadmin/Micron_7450_1/tianming/dataset/data_medical
dataset_kwargs: {}

train_dataset_kwargs:
  frame_num: 2
  load_flow: true
  flow_suffix: "_NewCT"
  split: trainval.txt
  zero_ann: false

# Test set: grasp10, all 601 sequences, first frame only
test_data_path: /media/mitiadmin/Micron_7450_1/tianming/dataset/CMC_grasp10_deinterlaced
test_dataset_kwargs:
  frame_num: 1
  load_flow: false
  split: ImageSets/trainval_single.txt
  zero_ann: false

trainer_kwargs:
  amp_backend: "native"
  precision: 32
  benchmark: true

model_kwargs:
  w_seg: 1.0
  w_sharpen: 0
  w_entropy: 0.05
  separate_residual: true
  mask_layer: 5
  align_corners: false
  mask_size: [128, 128]
  allow_mask_resize: true
  log_interval: 9999

  w_dino: 0.05
  dino_checkpoint: /home/tianming/.cache/torch/hub/checkpoints/dino_deitsmall8_300ep_pretrain.pth
  dino_arch: vit_small
  dino_patch_size: 8
  dino_input_size: 128

  backbone2:
    dilations: [1, 1, 2, 4]
    strides: [1, 2, 1, 1]
    type: ResNet
    depth: 50
    num_stages: 4
    out_indices: [0, 1, 2, 3]
    norm_cfg: &id001
      type: BN
      requires_grad: true
    norm_eval: false
    style: pytorch
    contract_dilation: true

  decode_head:
    ssim_sz: 1
    create_flownet: true
    mask_layer: 5
    type: FlowAggregationHeadWithResidualV2
    topk: 4
    boundary_threshold: 0.1745
    flow_feat_before_agg_kernel_size: 3
    num_flow_feat_channels: 64
    mask_size: [128, 128]
    norm_flow: false
    clamp_flow_t: 10.
    free_residual: false
    free_residual_with_affine: true
    free_scale: false
    outlier_robust_loss: false
    eps: 0.01
    q: 0.4
    allow_residual_resize: true
    residual_adjustment_scale: 10.
    pred_div_coeff: 10.

  decode_head2:
    input_transform: resize_concat
    concat_input: false
    dilation: 6
    channels: 256
    type: FCNHead
    in_channels: [256, 2048]
    in_index: [0, 3]
    num_convs: 2
    dropout_ratio: 0.1
    num_classes: 5
    norm_cfg: *id001
    align_corners: false
    loss_decode:
      type: CrossEntropyLoss
      use_sigmoid: false
      loss_weight: 1.0

  decode_head3:
    concat_input: false
    dilation: 6
    channels: 256
    type: FCNHead
    in_channels: 4096
    in_index: -1
    num_convs: 2
    dropout_ratio: 0.1
    num_classes: 20
    norm_cfg: *id001
    align_corners: false
    loss_decode:
      type: CrossEntropyLoss
      use_sigmoid: false
      loss_weight: 1.0
