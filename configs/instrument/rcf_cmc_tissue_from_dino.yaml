# rcf_cmc_tissue_from_dino.yaml
#
# Stage 2: tissue-role fine-tune, starting from the best DINO Phase 1 checkpoint
#
# DINO Phase 1 channel roles (60-frame statistics from trainval.txt):
#   ch0 = manipulated soft tissue  (lowest flow_mag, largest area 30%)
#   ch1 = instrument               (visually confirmed; highest flow_mag 54.7)
#   ch2/3/4 = background/other     (used as background reference baseline)
#
# Loss configuration:
#   L_rigid      → ch1 (instrument rigidity)
#   L_deform     → ch0 vs [2,3,4] (tissue deformation > background)
#   L_motion     → ch0 vs [2,3,4] (tissue motion > background)
#   L_grasp_conv → ch1 (instrument-level convergence prior, lower weight)
#   L_align      → ch0 follows ch1 direction (tissue dragged by instrument)
#
# Usage:
#   python main_tissue.py configs/instrument/rcf_cmc_tissue_from_dino.yaml

batch_size: 8
epochs: 30
learning_rate: 5.e-6
optimizer: Adam
weight_decay: 1.e-4

workers: 16

checkpoints_dir: saved/cmc_tissue_from_dino
pretrained_model: saved/cmc_dino_phase1_260605_143205/epoch=7-step=1800.ckpt
model_cls: RCFTissueModel

eval_pos_th: 0.35

disable_wandb: true
allow_overwriting_checkpoints_dir: false

train_transform_kwargs:
  strong_aug: true

test_transform_kwargs:
  strong_aug: false

loss_log_interval: 10

object_channel: null

data_path: /media/mitiadmin/Micron_7450_1/tianming/dataset/data_medical
dataset_kwargs: {}

train_dataset_kwargs:
  frame_num: 2
  load_flow: true
  flow_suffix:  "_NewCT"
  flow_suffix2: "_NewCT2"
  flow_suffix3: "_NewCT3"
  split: trainval.txt        # all 8 datasets, consistent with Phase 1
  zero_ann: false

test_dataset_kwargs:
  frame_num: 1
  load_flow: false
  split: fold1_val.txt       # datasets 1,3: have annotations
  zero_ann: false

lr_scheduler_kwargs:
  power: 0.9
  min_lr: 1.e-6

set_object_channel_after_epoch: 5
saved_eval_dir_name: saved_eval

trainer_kwargs:
  check_val_every_n_epoch: 1
  amp_backend: "native"
  precision: 32
  benchmark: true

model_kwargs:
  # ── Standard RCF/V2b parameters ──────────────────────────────────────────
  w_seg: 1.0
  w_sharpen: 0
  w_entropy: 0.05
  separate_residual: true
  mask_layer: 5
  align_corners: false
  mask_size: [128, 128]
  allow_mask_resize: true

  backbone2:
    dilations: [1, 1, 2, 4]
    strides: [1, 2, 1, 1]
    type: ResNet
    depth: 50
    num_stages: 4
    out_indices: [0, 1, 2, 3]
    norm_cfg: &id001
      type: BN
      requires_grad: true
    norm_eval: false
    style: pytorch
    contract_dilation: true

  decode_head:
    ssim_sz: 1
    create_flownet: true
    mask_layer: 5
    type: FlowAggregationHeadWithResidualV2
    topk: 4
    boundary_threshold: 0.1745
    flow_feat_before_agg_kernel_size: 3
    num_flow_feat_channels: 64
    mask_size: [128, 128]
    norm_flow: false
    clamp_flow_t: 10.
    free_residual: false
    free_residual_with_affine: true
    free_scale: false
    outlier_robust_loss: false
    eps: 0.01
    q: 0.4
    allow_residual_resize: true
    residual_adjustment_scale: 10.
    pred_div_coeff: 10.

  decode_head2:
    input_transform: resize_concat
    concat_input: false
    dilation: 6
    channels: 256
    type: FCNHead
    in_channels: [256, 2048]
    in_index: [0, 3]
    num_convs: 2
    dropout_ratio: 0.1
    num_classes: 5
    norm_cfg: *id001
    align_corners: false
    loss_decode:
      type: CrossEntropyLoss
      use_sigmoid: false
      loss_weight: 1.0

  decode_head3:
    concat_input: false
    dilation: 6
    channels: 256
    type: FCNHead
    in_channels: 4096
    in_index: -1
    num_convs: 2
    dropout_ratio: 0.1
    num_classes: 20
    norm_cfg: *id001
    align_corners: false
    loss_decode:
      type: CrossEntropyLoss
      use_sigmoid: false
      loss_weight: 1.0

  # ── Channel roles (DINO Phase 1 statistics, 60 frames) ──────────────────
  # ch0 = manipulated soft tissue  (visually confirmed, lowest flow_mag 28.8, area 30%)
  # ch1 = instrument               (visually confirmed, highest flow_mag 54.7, area 24%)
  # ch2/3/4 = background/other     (used as background reference baseline)
  instrument_channels: [1]
  tissue_channel:      0
  grasping_channel:    1    # instrument is the source of grasping direction
  bg_channels:         [2, 3, 4]

  # ── Tissue-role loss weights ──────────────────────────────────────────────
  w_rigid:      0.01   # ch1 rigidity prior (ch1 dir_var slightly high, conservative weight)
  w_grasp_conv: 0.01   # ch1 convergence prior (already highest, low weight to reinforce)
  w_deform:     0.02   # ch0 residual > bg (small gap, gentle push)
  w_align:      0.08   # ch0 flow follows ch1 direction (strongest physical prior, upweighted)
  w_motion:     0.00   # disabled: ch0 has lowest flow_mag, contradicts assumption, would produce wrong gradients

  # Auxiliary parameters
  motion_margin:   1.0
  deform_margin:   0.5
  min_grasp_frac:  0.005

eval_save: true
eval_export: true
export_all_seg: true
