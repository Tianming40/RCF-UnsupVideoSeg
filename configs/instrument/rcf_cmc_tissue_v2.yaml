# rcf_cmc_tissue_v2.yaml
#
# V2 tissue-role fine-tune — improved loss design vs V1:
#
#   REMOVED  L_compact  → crushes elongated instrument masks
#   NEW      L_rigid    → low intra-segment flow-direction variance (rigidity), no shape compression
#   NEW      L_grasp_conv → divergence prior guides ch2 to localise grasping point (correct use of convergence prior)
#   NEW      L_deform   → tissue residual R̂ > background (non-rigid deformation)
#   KEPT     L_align    → tissue follows grasping-point direction (weight reduced 0.10→0.05)
#   KEPT     L_motion   → tissue moves more than background (weight reduced 0.05→0.03)
#
# Restart from v2b checkpoint (not tissue_v1, because v1's instrument mask has already fragmented)
#
# Usage:
#   python main_tissue.py configs/instrument/rcf_cmc_tissue_v2.yaml

batch_size: 8
epochs: 30
learning_rate: 2.e-5
optimizer: Adam
weight_decay: 1.e-4

workers: 16

checkpoints_dir: saved/cmc_tissue_v2
pretrained_model: saved/cmc_grasp10_finetune_v2b_260604_120527/last.ckpt
model_cls: RCFTissueModel

eval_pos_th: 0.35

disable_wandb: true
allow_overwriting_checkpoints_dir: false

train_transform_kwargs:
  strong_aug: true

test_transform_kwargs:
  strong_aug: false

loss_log_interval: 10

object_channel: null

data_path: /media/mitiadmin/Micron_7450_1/tianming/dataset/CMC_grasp0_deinterlaced
dataset_kwargs: {}

train_dataset_kwargs:
  frame_num: 2
  load_flow: true
  flow_suffix:  "_NewCT"
  flow_suffix2: "_NewCT"
  flow_suffix3: "_NewCT"
  split: ImageSets/train.txt
  zero_ann: true

test_data_path: /media/mitiadmin/Micron_7450_1/tianming/dataset/data_medical

test_dataset_kwargs:
  frame_num: 1
  load_flow: false
  split: fold1_val.txt
  zero_ann: false

lr_scheduler_kwargs:
  power: 0.9
  min_lr: 1.e-6

set_object_channel_after_epoch: 5
saved_eval_dir_name: saved_eval

trainer_kwargs:
  check_val_every_n_epoch: 1
  amp_backend: "native"
  precision: 32
  benchmark: true

model_kwargs:
  # ── Standard RCF/V2b parameters (unchanged) ────────────────────────────
  w_seg: 1.0
  w_sharpen: 0
  w_entropy: 0.05
  separate_residual: true
  mask_layer: 5
  align_corners: false
  mask_size: [128, 128]
  allow_mask_resize: true

  backbone2:
    dilations: [1, 1, 2, 4]
    strides: [1, 2, 1, 1]
    type: ResNet
    depth: 50
    num_stages: 4
    out_indices: [0, 1, 2, 3]
    norm_cfg: &id001
      type: BN
      requires_grad: true
    norm_eval: false
    style: pytorch
    contract_dilation: true

  decode_head:
    ssim_sz: 1
    create_flownet: true
    mask_layer: 5
    type: FlowAggregationHeadWithResidualV2
    topk: 4
    boundary_threshold: 0.1745
    flow_feat_before_agg_kernel_size: 3
    num_flow_feat_channels: 64
    mask_size: [128, 128]
    norm_flow: false
    clamp_flow_t: 10.
    free_residual: false
    free_residual_with_affine: true
    free_scale: false
    outlier_robust_loss: false
    eps: 0.01
    q: 0.4
    allow_residual_resize: true
    residual_adjustment_scale: 10.
    pred_div_coeff: 10.

  decode_head2:
    input_transform: resize_concat
    concat_input: false
    dilation: 6
    channels: 256
    type: FCNHead
    in_channels: [256, 2048]
    in_index: [0, 3]
    num_convs: 2
    dropout_ratio: 0.1
    num_classes: 5
    norm_cfg: *id001
    align_corners: false
    loss_decode:
      type: CrossEntropyLoss
      use_sigmoid: false
      loss_weight: 1.0

  decode_head3:
    concat_input: false
    dilation: 6
    channels: 256
    type: FCNHead
    in_channels: 4096
    in_index: -1
    num_convs: 2
    dropout_ratio: 0.1
    num_classes: 20
    norm_cfg: *id001
    align_corners: false
    loss_decode:
      type: CrossEntropyLoss
      use_sigmoid: false
      loss_weight: 1.0

  # ── Channel roles (from 60-frame statistical analysis) ──────────────────
  # ch0 = instrument body  (lowest dir-var 0.948, area 6.3%)
  # ch1 = soft tissue      (area 34%, residual 0.479, flow 10.2)
  # ch2 = grasping point   (highest convergence 0.121, area 2.8%)
  # ch3 = instrument joint (highest flow-mag 12.9, area 3.3%)
  # ch4 = background       (lowest flow 5.5, area 53%)
  instrument_channels: [0, 2, 3]
  tissue_channel:      1
  grasping_channel:    2
  bg_channels:         [4]

  # ── Tissue-role loss weights (V2) ────────────────────────────────────────
  w_rigid:      0.02   # replaces compact: intra-segment flow-direction variance (rigidity), no shape compression
  w_grasp_conv: 0.05   # convergence prior: divergence map guides ch2 to localise grasping point
  w_deform:     0.05   # deformation prior: tissue R̂ > background R̂
  w_align:      0.05   # tissue flow direction aligns with grasping-point direction (reduced from v1's 0.10)
  w_motion:     0.03   # tissue moves more than background (reduced from v1's 0.05)

  # Auxiliary parameters
  motion_margin:   1.0   # L_motion hinge margin (pixels)
  deform_margin:   0.5   # L_deform hinge margin (pixels)
  min_grasp_frac:  0.005 # L_align suppression threshold

eval_save: true
eval_export: true
export_all_seg: true
